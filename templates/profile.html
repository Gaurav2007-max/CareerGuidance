{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h2>Edit Profile</h2>
    <hr style="margin: 1rem 0;">
    <form action="{{ url_for('profile') }}" method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ user.full_name }}" required>
        </div>
        <div class="form-group">
            <label>Education</label>
            <input type="text" name="education" value="{{ user.education }}" required>
        </div>
        <div class="form-group">
            <label>Primary Career Goal</label>
            <input type="text" name="goal" value="{{ user.goal }}" required>
        </div>
        <div class="form-group">
            <label>Technical Skills</label>
            <textarea name="skills" rows="3" required>{{ user.skills }}</textarea>
        </div>
        <div class="form-group">
            <label>Interests</label>
            <textarea name="interest" rows="3" required>{{ user.interest }}</textarea>
        </div>
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a href="{{ url_for('dashboard') }}" class="btn" style="background: #ccc; color: black;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
