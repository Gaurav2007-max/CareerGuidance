{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Join Path Finder</h2>
    <p>Fill out your profile to start receiving customized career advice.</p>
    <hr style="margin: 1rem 0;">
    <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Education</label>
            <input type="text" name="education" placeholder="e.g. B.Tech in CSE" required>
        </div>
        <div class="form-group">
            <label>Primary Career Goal</label>
            <input type="text" name="goal" placeholder="e.g. Become a Senior DevOps Engineer" required>
        </div>
        <div class="form-group">
            <label>Technical Skills</label>
            <textarea name="skills" rows="3" placeholder="e.g. Python, Docker, SQL, Leadership" required></textarea>
        </div>
        <div class="form-group">
            <label>Interests</label>
            <textarea name="interest" rows="3" placeholder="e.g. Cloud Computing, AI ethics" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
    </form>
</div>
{% endblock %}
